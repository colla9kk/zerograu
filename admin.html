<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Zero Grau | Gerenciar Cardápio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: { brand: { 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' } }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen pb-12">

  <header class="bg-zinc-900/90 border-b border-zinc-800 sticky top-0 z-30 px-6 py-4 backdrop-blur">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center font-black text-white text-lg">0°</div>
        <div>
          <h1 class="font-extrabold text-lg text-white">PAINEL ADMINISTRATIVO</h1>
          <p class="text-xs text-zinc-400">Gerenciador de Cardápio em Tempo Real</p>
        </div>
      </div>
      <a href="index.html" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-xs font-bold px-3 py-2 rounded-xl transition">
        👁️ Ver Cardápio
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 mt-8 space-y-8">
    
    <!-- Form de Novo Produto -->
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
      <h2 class="text-base font-extrabold text-white mb-4 flex items-center gap-2">
        <span>➕ Cadastrar Novo Item</span>
      </h2>

      <form id="form-add-produto" onsubmit="salvarProduto(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-zinc-300 mb-1">Nome do Item *</label>
            <input type="text" id="p-nome" required placeholder="Ex: Açaí Turbinado 500ml" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-zinc-300 mb-1">Categoria *</label>
            <select id="p-cat" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-500">
              <option value="burgers">🍔 Hambúrgueres</option>
              <option value="combos">🔥 Combos</option>
              <option value="acai">🍧 Açaí</option>
              <option value="porcoes">🍟 Porções</option>
              <option value="bebidas">🥤 Bebidas</option>
              <option value="sobremesas">🍰 Sobremesas</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-zinc-300 mb-1">Preço (R$) *</label>
            <input type="text" id="p-preco" required placeholder="25,90" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-zinc-300 mb-1">Selo / Badge (Opcional)</label>
            <input type="text" id="p-badge" placeholder="Ex: Mais Pedido, Promoção" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-zinc-300 mb-1">Foto do Produto (Enviar do Celular ou PC)</label>
          <input type="file" id="p-imagem-file" accept="image/*" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-zinc-800 file:text-white hover:file:bg-zinc-700 cursor-pointer">
        </div>

        <div>
          <label class="block text-xs font-bold text-zinc-300 mb-1">Descrição / Ingredientes</label>
          <textarea id="p-desc" rows="2" placeholder="Ex: Açaí com banana, leite em pó e leite condensado" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-500 resize-none"></textarea>
        </div>

        <button type="submit" id="btn-salvar" class="w-full bg-brand-600 hover:bg-brand-500 font-extrabold text-sm py-3.5 rounded-xl transition">
          Salvar Produto no Cardápio
        </button>
      </form>
    </div>

    <!-- Lista de Produtos Cadastrados -->
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl">
      <h2 class="text-base font-extrabold text-white mb-4">Cardápio Atual</h2>
      <div id="lista-admin-produtos" class="space-y-3"></div>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
