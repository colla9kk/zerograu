<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS - Painel da Cozinha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#ef4444', 600: '#dc2626' }
          }
        }
      }
    }
  </script>
  <style>
    /* Estilo exclusivo para impressora térmica (80mm/58mm) */
    @media print {
      body * {
        visibility: hidden;
      }
      #comanda-impressao, #comanda-impressao * {
        visibility: visible;
      }
      #comanda-impressao {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        color: #000 !important;
        background: #fff !important;
        font-family: monospace;
        padding: 5px;
      }
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen p-4 sm:p-6 pb-12">

  <!-- Header do Painel -->
  <header class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 border-b border-zinc-800 mb-6 max-w-7xl mx-auto">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center font-black text-xl text-white">0°</div>
      <div>
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
          PAINEL DA COZINHA
          <span class="bg-brand-500/10 text-brand-500 border border-brand-500/20 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase">KDS LIVE</span>
        </h1>
        <p class="text-xs text-zinc-400">Monitor de Preparo em Tempo Real</p>
      </div>
    </div>

    <!-- Indicadores do Topo -->
    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
      <div class="bg-zinc-900 border border-zinc-800 px-4 py-2 rounded-xl text-center">
        <span class="text-[10px] font-extrabold text-zinc-500 uppercase block">Pendentes</span>
        <span id="kds-count-pendentes" class="text-lg font-black text-brand-500">0</span>
      </div>
      <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-2 rounded-xl">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-bold text-emerald-400">Conectado ao Vivo</span>
      </div>
    </div>
  </header>

  <!-- Container Grid dos Cards -->
  <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 max-w-7xl mx-auto" id="lista-pedidos-kds">
    <div class="col-span-full text-center py-20 text-zinc-500 font-bold text-sm">
      🔄 Carregando comandas...
    </div>
  </main>

  <!-- Container Oculto para Impressão Térmica -->
  <div id="comanda-impressao" class="hidden"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/cozinha.js"></script>
</body>
</html>
